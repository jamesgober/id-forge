[package]
name = "id-forge"
version = "1.2.0"
edition = "2021"
rust-version = "1.75"
readme = "README.md"
license = "Apache-2.0 OR MIT"

authors = [
    "James Gober <me@jamesgober.com>"
]

description = "Typed, high-performance unique ID generation for Rust. UUID v4/v7, ULID, Snowflake, NanoID, and custom epoch-based schemes in one library. Random IDs come from the OS random source. No third-party dependencies. Monotonic, distributed-safe, sortable variants."

keywords = [
    "uuid",
    "ulid",
    "snowflake",
    "nanoid",
    "id"
]

categories = [
    "algorithms",
    "data-structures",
    "no-std"
]

documentation = "https://docs.rs/id-forge"
repository = "https://github.com/jamesgober/id-forge"
homepage = "https://github.com/jamesgober/id-forge"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# OS random source (`tier3`) for UUID v4/v7, ULID and NanoID. A
# first-party crate with no dependencies of its own.
mod-rand = { version = "1.0", optional = true, default-features = false, features = ["tier3"] }

[dev-dependencies]

[[example]]
name = "basic"
required-features = ["uuid", "ulid", "snowflake", "nanoid"]

[[example]]
name = "bench"
required-features = ["uuid", "ulid", "snowflake", "nanoid"]

[[example]]
name = "uuid_v4"
required-features = ["uuid"]

[[example]]
name = "uuid_v7"
required-features = ["uuid"]

[[example]]
name = "ulid_monotonic"
required-features = ["ulid"]

[[example]]
name = "snowflake_distributed"
required-features = ["snowflake"]

[[example]]
name = "snowflake_clock_skew"
required-features = ["snowflake"]

[[example]]
name = "nanoid_short_url"
required-features = ["nanoid"]

[[example]]
name = "nanoid_validate"
required-features = ["nanoid"]

[[test]]
name = "smoke"
required-features = ["uuid", "ulid", "snowflake", "nanoid"]

[[test]]
name = "fork"
required-features = ["uuid", "ulid", "nanoid"]

[features]
default = ["std", "uuid", "ulid", "snowflake", "nanoid"]
std = []
uuid = ["std", "dep:mod-rand"]
ulid = ["std", "dep:mod-rand"]
snowflake = ["std"]
nanoid = ["std", "dep:mod-rand"]

[profile.release]
opt-level = 3
lto = "thin"
